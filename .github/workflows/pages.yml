name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar numpy e matplotlib
        run: pip install numpy matplotlib

      - name: Testes
        run: |
          node tests/burgers-core.test.js
          node tests/lei-core.test.js
          node tests/grafo-core.test.js
          node tests/conv-core.test.js
          node tests/onda-core.test.js
          node tests/transp-core.test.js
          node tests/sep-core.test.js
          node tests/hl-core.test.js
          node tests/sf-core.test.js
          node tests/ma-core.test.js
          python3 tests/run_python_cells.py
          node tests/smoke_dom.js
          python3 tests/check_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
